name: dispatch
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
permissions: { actions: write, contents: write }
concurrency: { group: dispatch }
env:
  PRIVATE_REPO: nguyenphp/vibecut
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub tắt cron nếu repo không có commit 60 ngày; commit giữ sống mỗi 30 ngày.
      - name: keepalive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u > .keepalive
            git config user.name cutcut-runner
            git config user.email 62367533+nguyenphp@users.noreply.github.com
            git add .keepalive && git commit -qm keepalive && git push -q
          fi
      - name: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          PRIV_TOKEN: ${{ secrets.VIBECUT_PAT }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_BOT_TOKEN_1: ${{ secrets.TG_BOT_TOKEN_1 }}
          TOK_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          TOK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
        run: bash scripts/dispatch.sh
      # Trạng thái công khai cho trang văn phòng (chỉ số/mã/trạng thái, không tiêu đề) → nhánh `status`.
      - name: status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRIV_TOKEN: ${{ secrets.VIBECUT_PAT }}
        run: bash scripts/publish-status.sh || true
      # Bảng GitHub Projects "CutCut Runner". Không có PROJECT_TOKEN thì bỏ qua.
      - name: board
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: '[ -n "$GH_TOKEN" ] && bash scripts/project-sync.sh || echo "chưa có PROJECT_TOKEN"'
