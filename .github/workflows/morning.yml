name: morning
# 8:00 giờ Việt Nam (01:00 UTC): báo cáo tiến độ + đề xuất việc mới chờ duyệt.
on:
  schedule: [{ cron: '0 1 * * *' }]
  workflow_dispatch:
concurrency: { group: morning }
permissions: { contents: read }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env:
      GH_TOKEN: ${{ secrets.VIBECUT_PAT }}
      REPO: nguyenphp/vibecut
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      TG_BOT_TOKEN_1: ${{ secrets.TG_BOT_TOKEN_1 }}
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with: { repository: nguyenphp/vibecut, token: '${{ secrets.VIBECUT_PAT }}', path: vibecut, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: báo cáo + đề xuất
        working-directory: runner
        env:
          TOK_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          TOK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          VIBECUT_DIR: ${{ github.workspace }}/vibecut
        run: |
          npm i -g --silent @anthropic-ai/claude-code
          bash scripts/morning.sh
